spring:
  application:
    name: catalog-service
  mongodb:
    uri: ${MONGODB_URI:mongodb://catalog_user:catalog_pass@localhost:27017/catalog_db}
  data:
    mongodb:
      auto-index-creation: true
      representation:
        big-decimal: decimal128 # store prices as exact decimals, not strings
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Fail fast when Redis is unreachable, so the MongoDB fallback isn't slowed down.
      timeout: 500ms
      connect-timeout: 500ms
  cache:
    type: redis

server:
  port: ${SERVER_PORT:8082}

ticketflow:
  jwt:
    # No default on purpose: the service refuses to start without a secret.
    secret: ${JWT_SECRET:}
    issuer: ticketflow-auth
  cache:
    ttl: ${CACHE_TTL:10m}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Ready as long as MongoDB is up: Redis is optional (see CacheConfig).
        readiness:
          include: readinessState,mongo
