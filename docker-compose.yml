# Local environment for TicketFlow. Services are added here as they are built.
# Values not set in .env fall back to development-only defaults (see .env.example).

name: ticketflow

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-root}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./infra/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build: ./auth-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/auth_db
      DB_USERNAME: auth_user
      DB_PASSWORD: auth_pass
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-0123456789abcdef}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1h}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ticketflow.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin12345}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  catalog-service:
    build: ./catalog-service
    environment:
      MONGODB_URI: mongodb://catalog_user:catalog_pass@mongo:27017/catalog_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-0123456789abcdef}
    ports:
      - "8082:8082"
    depends_on:
      mongo:
        condition: service_healthy
      # Redis is not "service_healthy" on purpose: catalog works without it (cache only).
      redis:
        condition: service_started

  inventory-service:
    build: ./inventory-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/inventory_db
      DB_USERNAME: inventory_user
      DB_PASSWORD: inventory_pass
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-0123456789abcdef}
      HOLD_DURATION: ${HOLD_DURATION:-10m}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  mongo-data:
