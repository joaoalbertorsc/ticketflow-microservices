# Local environment for TicketFlow. Services are added here as they are built.
# Values not set in .env fall back to development-only defaults (see .env.example).

name: ticketflow

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build: ./auth-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/auth_db
      DB_USERNAME: auth_user
      DB_PASSWORD: auth_pass
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-0123456789abcdef}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1h}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ticketflow.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin12345}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
