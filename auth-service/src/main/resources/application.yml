spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${DB_USERNAME:auth_user}
    password: ${DB_PASSWORD:auth_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway owns the schema; Hibernate only checks it matches the entities

server:
  port: ${SERVER_PORT:8081}

ticketflow:
  jwt:
    # No default on purpose: the service refuses to start without a secret.
    secret: ${JWT_SECRET:}
    issuer: ticketflow-auth
    expiration: ${JWT_EXPIRATION:1h}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
