# Builds and tests api-gateway whenever its code changes. Ubuntu runners have Docker, so the
# Testcontainers tests run here exactly as they do locally.
name: api-gateway

on:
  push:
    branches: [main, develop]
    paths:
      - 'api-gateway/**'
      - '!api-gateway/**/*.md'
      - '.github/workflows/api-gateway.yml'
  pull_request:
    paths:
      - 'api-gateway/**'
      - '!api-gateway/**/*.md'
      - '.github/workflows/api-gateway.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-gateway
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: api-gateway/pom.xml

      - name: Test
        run: ./mvnw -B verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: api-gateway-test-reports
          path: api-gateway/target/surefire-reports/
