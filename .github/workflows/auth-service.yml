# Builds and tests auth-service whenever its code changes. Ubuntu runners have Docker, so the
# Testcontainers tests run here exactly as they do locally.
name: auth-service

on:
  push:
    branches: [main, develop]
    paths:
      - 'auth-service/**'
      - '!auth-service/**/*.md'
      - '.github/workflows/auth-service.yml'
  pull_request:
    paths:
      - 'auth-service/**'
      - '!auth-service/**/*.md'
      - '.github/workflows/auth-service.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-service
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: auth-service/pom.xml

      - name: Test
        run: ./mvnw -B verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: auth-service-test-reports
          path: auth-service/target/surefire-reports/
