# Builds and tests payment-service whenever its code changes. Ubuntu runners have Docker, so the
# Testcontainers tests run here exactly as they do locally.
name: payment-service

on:
  push:
    branches: [main, develop]
    paths:
      - 'payment-service/**'
      - '!payment-service/**/*.md'
      - '.github/workflows/payment-service.yml'
  pull_request:
    paths:
      - 'payment-service/**'
      - '!payment-service/**/*.md'
      - '.github/workflows/payment-service.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment-service
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: payment-service/pom.xml

      - name: Test
        run: ./mvnw -B verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: payment-service-test-reports
          path: payment-service/target/surefire-reports/
